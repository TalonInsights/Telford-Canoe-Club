<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telford Canoe Club</title>
<meta name="description" content="Telford Canoe Club — new website in development.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🛶</text></svg>">
<style>
  :root {
    --river:   #0f3d4c;
    --deep:    #07222c;
    --paddle:  #d8842f;
    --foam:    #f4f7f8;
    --muted:   rgba(244, 247, 248, 0.66);
    --rule:    rgba(244, 247, 248, 0.16);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    background: radial-gradient(120% 90% at 50% 0%, var(--river) 0%, var(--deep) 70%);
    color: var(--foam);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  main { max-width: 34rem; text-align: center; }

  .mark {
    font-size: 2.75rem;
    line-height: 1;
    margin-bottom: 1.25rem;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.9rem, 6vw, 2.9rem);
    font-weight: 650;
    letter-spacing: -0.02em;
  }

  .rule {
    width: 3.5rem;
    height: 2px;
    margin: 1.5rem auto;
    border: 0;
    background: var(--paddle);
  }

  p { margin: 0 0 1rem; color: var(--muted); }

  .status {
    display: inline-block;
    margin-top: 0.75rem;
    padding: 0.4rem 0.9rem;
    border: 1px solid var(--rule);
    border-radius: 999px;
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  footer {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    color: rgba(244, 247, 248, 0.4);
  }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🛶</div>
    <h1>Telford Canoe Club</h1>
    <hr class="rule">
    <p>Our new website is being built. Full details on the club, sessions, membership and getting started on the water will be here shortly.</p>
    <span class="status">Site in development</span>
    <footer>Built by Talon Consulting</footer>
  </main>
</body>
</html>
